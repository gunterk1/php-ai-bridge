doctrine:
    dbal:
        # SQLite keeps the demo dependency-light: no database server to run, and
        # the audit trail survives a container restart because the file is
        # mounted. Swapping in Postgres is a URL change — everything above the
        # DBAL is portable.
        url: '%env(resolve:DATABASE_URL)%'
    orm:
        auto_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        validate_xml_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App

when@test:
    doctrine:
        dbal:
            url: 'sqlite:///:memory:'
