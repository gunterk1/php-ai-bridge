services:
  ai-service:
    build: ./ai-service
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      CHAT_MODEL: ${CHAT_MODEL:-gpt-4o-mini}
      EMBED_MODEL: ${EMBED_MODEL:-text-embedding-3-small}
    ports:
      - "8000:8000"
    # Lets the container reach a model server running on the Linux host
    # (e.g. Ollama on localhost:11434) via http://host.docker.internal:...
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  php-app:
    build: ./php-app
    environment:
      AI_SERVICE_URL: http://ai-service:8000
    ports:
      - "8080:8080"
    depends_on:
      ai-service:
        condition: service_healthy

  # The same product surface in a second ecosystem. It talks to the identical
  # ai-service over the identical REST boundary — running all three at once is
  # the point: open :8080, :8081 and :8082 side by side and the answers are the
  # same, because the AI capability never lived in the app layer.
  node-app:
    build: ./node-app
    environment:
      AI_SERVICE_URL: http://ai-service:8000
      PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      ai-service:
        condition: service_healthy

  # Third surface, and the one that is not just a re-implementation. Symfony with
  # Doctrine adds what a stateless proxy cannot have: an audit trail of which
  # question was answered from which passages. Same three endpoints, plus
  # /api/audit — and an API key on everything except /api/health.
  symfony-app:
    build: ./symfony-app
    environment:
      AI_SERVICE_URL: http://ai-service:8000
      API_KEY: ${API_KEY:-dev-key}
      APP_SECRET: ${APP_SECRET:-change-me-in-deployment}
      DATABASE_URL: sqlite:////app/var/audit.db
    ports:
      - "8082:8082"
    volumes:
      # The audit trail outlives the container; that is rather the point of one.
      - symfony-audit:/app/var
    depends_on:
      ai-service:
        condition: service_healthy

volumes:
  symfony-audit:
